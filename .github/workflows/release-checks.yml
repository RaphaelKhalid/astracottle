name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate static publication
        run: node scripts/check.mjs
      - name: Check offline controller
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Scan staged source and served data
        run: python -B scripts/public_safety_check.py --git-index . site
      - name: Check deterministic fixtures
        run: python -B experiments/pilot/scenario_selftest.py
      - name: Check transport isolation
        env:
          LOCALAPPDATA: /tmp
        run: python -B experiments/pilot/transport_selftest.py
      - name: Check mechanism design
        run: python -B experiments/experiment02/selftest.py
      - name: Verify unchanged preregistration
        run: python -B scripts/check_plan.py
      - name: Check evidence-screen fixtures
        run: python -B experiments/experiment03/selftest.py
      - name: Verify evidence-screen preregistration
        run: python -B scripts/check_screen.py
      - name: Check late-request fixtures
        run: python -B experiments/experiment04/selftest.py
      - name: Verify late-request preregistration
        run: python -B scripts/check_e4.py
      - name: Check reviewer diagnostic
        run: python -B experiments/experiment05/selftest.py
      - name: Verify reviewer diagnostic preregistration
        run: python -B scripts/check_e5.py
      - name: Check pre-action integrity probe
        run: python -B experiments/experiment06/selftest.py
      - name: Verify pre-action integrity preregistration
        run: python -B scripts/check_e6.py
      - name: Check benign-mismatch control
        run: python -B experiments/experiment07/selftest.py
      - name: Verify benign-mismatch preregistration
        run: python -B scripts/check_e7.py
      - name: Verify one-call extension bindings
        run: python -B experiments/experiment07_extension/extension.py --check
